# Door-access outbox drain: MANUAL ONLY. Nothing schedules it.
#
# Disabled by the owner on 2026-11-04. The Vercel team is on the Hobby plan,
# which refuses to deploy any cron that runs more than once a day, and the
# five-minute schedule this workflow carried instead never fired: 0 scheduled
# runs in more than 4 hours, while workflow_dispatch worked every time. Until a
# scheduler that works is in place, the drain runs only when someone runs it.
#
# Read docs/architecture/access-control-master.md §4.5 before changing it.
#
# - To drain by hand: Actions -> "Drain access sync" -> Run workflow, or
#   `gh workflow run drain-access-sync.yml`. One run drains one batch (at most
#   DRAIN_BATCH_SIZE jobs, one per member), so a backlog needs several runs.
# - While it is off, queued changes do not reach the readers. Registration
#   pushes a new member inline; payments, day passes, status changes and the
#   nightly reconcile reach a reader only through the outbox. Re-enable a
#   scheduled drain before a real gym connects readers, and before a hardware
#   day (hw-session's `jobs --wait` waits for production's drain).
# - To re-enable: on Vercel Pro, rebase da75912 (branch
#   fix/drain-back-to-vercel-cron) onto master and push it; it moves the
#   five-minute cron back into vercel.json and deletes this workflow, and it
#   predates the commit that disabled the schedule, so it conflicts until
#   rebased. On Hobby, schedule it with Supabase pg_cron + pg_net, with the
#   secret in Vault. Not a GitHub schedule: it never fired.
# - This repository is public, so its Actions logs are too. Print the HTTP
#   status only, never the response body: it carries counts and vendor error
#   text.

name: Drain access sync

on:
  workflow_dispatch:

concurrency:
  group: drain-access-sync
  cancel-in-progress: false

permissions: {}

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the drain
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRAIN_URL: https://www.metricgymos.com/api/cron/drain-access-sync
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set in Actions secrets"
            exit 1
          fi
          code=000
          for attempt in 1 2; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 75 \
              -X POST -H "Authorization: Bearer $CRON_SECRET" "$DRAIN_URL") || code=000
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = 200 ]; then exit 0; fi
            # Retry once on a server error or no answer; anything else (401,
            # 403, 404) will not change in 20 seconds.
            case "$code" in
              5*|000) [ "$attempt" = 1 ] && sleep 20 ;;
              *) break ;;
            esac
          done
          echo "::error::drain-access-sync answered HTTP $code"
          exit 1
